{% extends "base_dashboard.html" %}

{% block page_title %}Clientes{% endblock %}

{% block actions %}
{% if request.user.rol in "ADMINISTRADOR,OFICIAL" or request.user.is_superuser %}
<a href="{% url 'clientes:crear' %}" role="button">+ Nuevo Cliente</a>
{% endif %}
{% endblock %}

{% block content %}
<form method="get" role="search">
  <input type="search" name="q" value="{{ q }}" placeholder="Buscar por C.I., nombres o apellidos...">
  <button type="submit">Buscar</button>
</form>

<figure>
  <table>
    <thead>
      <tr>
        <th>C.I.</th>
        <th>Nombre Completo</th>
        <th>Teléfono</th>
        <th>Ingresos</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for c in clientes %}
      <tr>
        <td><strong>{{ c.ci }}</strong></td>
        <td>{{ c.apellidos }}, {{ c.nombres }}</td>
        <td>{{ c.telefono|default:"—" }}</td>
        <td>Bs. {{ c.ingresos_mensuales|floatformat:2 }}</td>
        <td>
          <div class="actions">
            <a href="{% url 'clientes:detalle' c.pk %}" role="button" class="outline">Ver</a>
            {% if request.user.rol in "ADMINISTRADOR,OFICIAL" or request.user.is_superuser %}
            <a href="{% url 'clientes:editar' c.pk %}" role="button" class="outline">Editar</a>
            <a href="{% url 'clientes:eliminar' c.pk %}" role="button" class="outline danger">Eliminar</a>
            {% endif %}
          </div>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5">Sin clientes registrados.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% endblock %}
