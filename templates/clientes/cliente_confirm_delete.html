{% extends "base_dashboard.html" %}

{% block page_title %}Eliminar Cliente{% endblock %}

{% block content %}
<article>
  <p>¿Confirmar eliminación del cliente <strong>{{ object.nombres }} {{ object.apellidos }}</strong> (C.I. {{ object.ci }}) y sus registros asociados?</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <a href="{% url 'clientes:detalle' object.pk %}" role="button" class="outline">Cancelar</a>
      <button type="submit" class="danger">Eliminar</button>
    </div>
  </form>
</article>
{% endblock %}
