{% extends "base_dashboard.html" %}

{% block page_title %}Anular Pago {{ object.numero_recibo }}{% endblock %}

{% block content %}
<article>
  <p>¿Confirmar anulación del recibo <strong>{{ object.numero_recibo }}</strong> por <strong>Bs. {{ object.monto|floatformat:2 }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <a href="{% url 'pagos:comprobante' object.pk %}" role="button" class="outline">Cancelar</a>
      <button type="submit" class="danger">Anular Pago</button>
    </div>
  </form>
</article>
{% endblock %}
