{% if is_paginated %}
<nav class="pagination-nav no-print" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid #e5e7eb;">
  <small style="color: #6b7280; font-size: 0.8rem;">
    Página <strong>{{ page_obj.number }}</strong> de <strong>{{ paginator.num_pages }}</strong> 
    (Total: <strong>{{ paginator.count }}</strong> registros)
  </small>

  <div style="display: flex; gap: 0.4rem; align-items: center;">
    {% if page_obj.has_previous %}
      <a href="?page=1{% for key, val in request.GET.items %}{% if key != 'page' and val %}&{{ key }}={{ val }}{% endif %}{% endfor %}" role="button" class="outline" style="padding: 0.25rem 0.6rem; font-size: 0.78rem; margin: 0;" title="Primera página">&laquo;&laquo;</a>
      <a href="?page={{ page_obj.previous_page_number }}{% for key, val in request.GET.items %}{% if key != 'page' and val %}&{{ key }}={{ val }}{% endif %}{% endfor %}" role="button" class="outline" style="padding: 0.25rem 0.6rem; font-size: 0.78rem; margin: 0;">&laquo; Anterior</a>
    {% endif %}

    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}{% for key, val in request.GET.items %}{% if key != 'page' and val %}&{{ key }}={{ val }}{% endif %}{% endfor %}" role="button" class="outline" style="padding: 0.25rem 0.6rem; font-size: 0.78rem; margin: 0;">Siguiente &raquo;</a>
      <a href="?page={{ paginator.num_pages }}{% for key, val in request.GET.items %}{% if key != 'page' and val %}&{{ key }}={{ val }}{% endif %}{% endfor %}" role="button" class="outline" style="padding: 0.25rem 0.6rem; font-size: 0.78rem; margin: 0;" title="Última página">&raquo;&raquo;</a>
    {% endif %}
  </div>
</nav>
{% endif %}
