{% extends "base_dashboard.html" %}

{% block page_title %}Eliminar Solicitud #{{ object.id }}{% endblock %}

{% block content %}
<article>
  <p>¿Confirmar eliminación de la <strong>Solicitud #{{ object.id }}</strong> ({{ object.cliente.nombres }} {{ object.cliente.apellidos }})?</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <a href="{% url 'solicitudes:detalle' object.pk %}" role="button" class="outline">Cancelar</a>
      <button type="submit" class="danger">Eliminar</button>
    </div>
  </form>
</article>
{% endblock %}
