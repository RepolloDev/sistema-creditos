{% extends "base_dashboard.html" %}

{% block page_title %}Eliminar Evaluación #{{ object.id }}{% endblock %}

{% block content %}
<article>
  <p>¿Confirmar eliminación de la <strong>Evaluación #{{ object.id }}</strong> (Solicitud #{{ object.solicitud.id }})?</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <a href="{% url 'evaluacion:detalle' object.pk %}" role="button" class="outline">Cancelar</a>
      <button type="submit" class="danger">Eliminar</button>
    </div>
  </form>
</article>
{% endblock %}
