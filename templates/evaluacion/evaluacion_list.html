{% extends "base_dashboard.html" %}

{% block page_title %}Evaluaciones Crediticias{% endblock %}

{% block actions %}
{% if request.user.rol in "ADMINISTRADOR,ANALISTA" or request.user.is_superuser %}
<a href="{% url 'evaluacion:crear' %}" role="button">+ Nueva Evaluación</a>
{% endif %}
{% endblock %}

{% block content %}
<form method="get">
  <div class="grid">
    <input type="search" name="q" value="{{ q }}" placeholder="Buscar por C.I. o apellido...">
    <select name="riesgo">
      <option value="">Todos los riesgos</option>
      {% for val, label in niveles_riesgo %}
      <option value="{{ val }}" {% if riesgo_filtro == val %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <select name="resultado">
      <option value="">Todos los resultados</option>
      {% for val, label in resultados %}
      <option value="{{ val }}" {% if resultado_filtro == val %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <button type="submit">Filtrar</button>
  </div>
</form>

<figure>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Solicitud / Cliente</th>
        <th>Ingresos</th>
        <th>Gastos</th>
        <th>Capacidad Pago</th>
        <th>Riesgo</th>
        <th>Resultado</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for ev in evaluaciones %}
      <tr>
        <td class="mono">#{{ ev.id }}</td>
        <td>Sol. <span class="mono">#{{ ev.solicitud.id }}</span> — {{ ev.solicitud.cliente.apellidos }}, {{ ev.solicitud.cliente.nombres }} (<span class="mono">{{ ev.solicitud.cliente.ci }}</span>)</td>
        <td class="mono">Bs. {{ ev.ingresos|floatformat:2 }}</td>
        <td class="mono">Bs. {{ ev.gastos|floatformat:2 }}</td>
        <td class="mono">Bs. {{ ev.capacidad_pago|floatformat:2 }}</td>
        <td><span class="badge">{{ ev.get_nivel_riesgo_display }}</span></td>
        <td><span class="badge badge-{{ ev.resultado|lower }}">{{ ev.get_resultado_display }}</span></td>
        <td>
          <div class="actions">
            <a href="{% url 'evaluacion:detalle' ev.pk %}" role="button" class="outline">Ver</a>
            {% if request.user.rol == "ADMINISTRADOR" or request.user.is_superuser %}
            <a href="{% url 'evaluacion:eliminar' ev.pk %}" role="button" class="outline danger">Eliminar</a>
            {% endif %}
          </div>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="8">Sin evaluaciones registradas.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% endblock %}
