<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sistema de Créditos{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root,
    :root:not([data-theme="dark"]),
    [data-theme="light"],
    html[data-theme="light"],
    [data-theme="dark"] {
      --pico-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --pico-font-size: 88%;
      --pico-border-radius: 2px;
      --pico-line-height: 1.5;

      /* Monochrome Primary */
      --pico-primary: #111111;
      --pico-primary-background: #111111;
      --pico-primary-border: #111111;
      --pico-primary-underline: #111111;
      --pico-primary-hover: #333333;
      --pico-primary-hover-background: #333333;
      --pico-primary-hover-border: #333333;
      --pico-primary-hover-underline: #333333;
      --pico-primary-focus: rgba(0, 0, 0, 0.15);
      --pico-primary-inverse: #ffffff;

      /* Secondary */
      --pico-secondary: #444444;
      --pico-secondary-background: #444444;
      --pico-secondary-border: #444444;
      --pico-secondary-underline: #444444;
      --pico-secondary-hover: #222222;
      --pico-secondary-hover-background: #222222;
      --pico-secondary-hover-border: #222222;
      --pico-secondary-hover-underline: #222222;
      --pico-secondary-focus: rgba(0, 0, 0, 0.15);
      --pico-secondary-inverse: #ffffff;

      /* Contrast */
      --pico-contrast: #000000;
      --pico-contrast-background: #000000;
      --pico-contrast-border: #000000;
      --pico-contrast-underline: #000000;
      --pico-contrast-hover: #222222;
      --pico-contrast-hover-background: #222222;
      --pico-contrast-hover-border: #222222;
      --pico-contrast-focus: rgba(0, 0, 0, 0.15);
      --pico-contrast-inverse: #ffffff;

      /* Text & Surfaces */
      --pico-color: #111111;
      --pico-background-color: #ffffff;
      --pico-muted-color: #555555;
      --pico-muted-border-color: #cccccc;
      --pico-text-selection-color: rgba(0, 0, 0, 0.15);

      /* Headings */
      --pico-h1-color: #111111;
      --pico-h2-color: #111111;
      --pico-h3-color: #111111;
      --pico-h4-color: #111111;
      --pico-h5-color: #111111;
      --pico-h6-color: #111111;

      /* Form Controls */
      --pico-form-element-border-color: #888888;
      --pico-form-element-active-border-color: #111111;
      --pico-form-element-focus-color: #111111;
      --pico-form-element-spacing-vertical: 0.4rem;
      --pico-form-element-spacing-horizontal: 0.6rem;
      --pico-block-spacing-vertical: 1rem;
      --pico-block-spacing-horizontal: 1rem;
    }

    body { margin: 0; background: #ffffff; color: #111111; }
    .mono, code, kbd, samp, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    article { border: 1px solid #e0e0e0; box-shadow: none; border-radius: 2px; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid #e5e7eb; padding: 1.25rem 1rem; display: flex; flex-direction: column; justify-content: space-between; background: #fbfbfb; }
    .sidebar nav ul { flex-direction: column; align-items: stretch; margin: 0; padding: 0; list-style: none; }
    .sidebar nav li { list-style: none; margin-bottom: 0.15rem; }
    .sidebar nav .menu-group-title { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; margin: 1rem 0 0.35rem 0.5rem; }
    .sidebar nav .menu-group-title:first-child { margin-top: 0.2rem; }
    .sidebar nav a { padding: 0.35rem 0.6rem; text-decoration: none; color: #374151; display: block; border-radius: 3px; font-size: 0.88rem; }
    .sidebar nav a:hover { background: #e5e7eb; color: #111111; text-decoration: none; }
    .sidebar nav a[aria-current="page"] { background: #111111; color: #ffffff; font-weight: 600; }
    .main { padding: 1.5rem 2.25rem; max-width: 1200px; width: 100%; }
    .page-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.75rem; margin-bottom: 1.25rem; }
    .page-header h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .actions a, .actions button, .actions form { margin: 0; }
    td .actions { justify-content: flex-end; }
    table th { background: #f9fafb; border-bottom: 2px solid #e5e7eb; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.03em; color: #4b5563; }
    table td { border-bottom: 1px solid #f3f4f6; padding: 0.55rem 0.5rem; font-size: 0.88rem; vertical-align: middle; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.18rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-radius: 3px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #374151;
      line-height: 1.2;
      vertical-align: middle;
      white-space: nowrap;
    }
    .badge-aprobado, .badge-aprobada, .badge-vigente, .badge-pagada, .badge-pagado, .badge-firmado, .badge-activo {
      background-color: #ecfdf5;
      border-color: #10b981;
      color: #065f46;
    }
    .badge-registrada, .badge-en_evaluacion, .badge-evaluada, .badge-pendiente, .badge-generado, .badge-observado {
      background-color: #fffbeb;
      border-color: #f59e0b;
      color: #92400e;
    }
    .badge-rechazado, .badge-rechazada, .badge-en_mora, .badge-mora, .badge-vencida, .badge-castigado, .badge-inactivo {
      background-color: #fef2f2;
      border-color: #ef4444;
      color: #991b1b;
    }
    .badge-anulado {
      background-color: #f3f4f6;
      border-color: #9ca3af;
      color: #374151;
    }

    /* Stepper / Progress Bar */
    .stepper {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      padding: 0.6rem 0.9rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 3px;
      flex-wrap: wrap;
    }
    .stepper .step {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #9ca3af;
      font-weight: 500;
    }
    .stepper .step:not(:last-child)::after {
      content: "→";
      margin-left: 0.5rem;
      color: #d1d5db;
      font-weight: 400;
    }
    .stepper .step.active {
      color: #111111;
      font-weight: 700;
    }
    .stepper .step.completed {
      color: #065f46;
      font-weight: 600;
    }
    .stepper .step.rejected {
      color: #991b1b;
      font-weight: 600;
    }
    .stepper .step-num {
      display: inline-block;
      width: 1.25rem;
      height: 1.25rem;
      line-height: 1.25rem;
      text-align: center;
      border-radius: 50%;
      background: #e5e7eb;
      color: #4b5563;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .stepper .step.active .step-num {
      background: #111111;
      color: #ffffff;
    }
    .stepper .step.completed .step-num {
      background: #10b981;
      color: #ffffff;
    }
    .stepper .step.rejected .step-num {
      background: #ef4444;
      color: #ffffff;
    }

    /* Search Bar Component */
    .search-bar,
    form[role="search"] {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      align-items: stretch;
      border: none;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    .search-bar input[type="search"],
    form[role="search"] > input[type="search"] {
      margin-bottom: 0;
      flex: 1 1 auto;
      border: 1px solid #888888;
      border-radius: 2px;
      height: 2.4rem;
    }
    .search-bar button,
    .search-bar [type="submit"],
    form[role="search"] > :is(button, [type="submit"], [role="button"]) {
      width: auto;
      white-space: nowrap;
      margin-bottom: 0;
      border-radius: 2px;
      height: 2.4rem;
      padding: 0 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Strict Monochrome Buttons */
    button,
    [type="button"],
    [type="reset"],
    [type="submit"],
    [role="button"] {
      background-color: #111111;
      border-color: #111111;
      color: #ffffff;
      border-radius: 0;
    }
    button:hover,
    button:active,
    button:focus,
    [type="button"]:hover,
    [type="submit"]:hover,
    [role="button"]:hover,
    [role="button"]:focus {
      background-color: #333333;
      border-color: #333333;
      color: #ffffff;
    }

    /* Outline Buttons */
    button.outline,
    [type="button"].outline,
    [type="reset"].outline,
    [type="submit"].outline,
    [role="button"].outline {
      background-color: transparent;
      border-color: #111111;
      color: #111111;
    }
    button.outline:hover,
    button.outline:active,
    button.outline:focus,
    [type="button"].outline:hover,
    [type="submit"].outline:hover,
    [role="button"].outline:hover,
    [role="button"].outline:focus {
      background-color: #111111;
      border-color: #111111;
      color: #ffffff;
    }

    /* Secondary Buttons */
    button.secondary,
    [role="button"].secondary {
      background-color: #444444;
      border-color: #444444;
      color: #ffffff;
    }
    button.secondary.outline,
    [role="button"].secondary.outline {
      background-color: transparent;
      border-color: #444444;
      color: #444444;
    }
    button.secondary.outline:hover,
    [role="button"].secondary.outline:hover {
      background-color: #444444;
      border-color: #444444;
      color: #ffffff;
    }

    /* Links */
    a:not([role="button"]) {
      color: #111111;
      text-decoration: underline;
    }
    a:not([role="button"]):hover {
      color: #444444;
    }

    /* Semantic Alerts & Errors Only */
    .danger,
    button.danger,
    [type="submit"].danger,
    [role="button"].danger {
      background-color: #b91c1c !important;
      border-color: #b91c1c !important;
      color: #ffffff !important;
    }
    button.danger:hover,
    [type="submit"].danger:hover,
    [role="button"].danger:hover {
      background-color: #991b1b !important;
      border-color: #991b1b !important;
    }
    button.danger.outline,
    [type="submit"].danger.outline,
    [role="button"].danger.outline {
      background-color: transparent !important;
      border-color: #b91c1c !important;
      color: #b91c1c !important;
    }
    button.danger.outline:hover,
    [type="submit"].danger.outline:hover,
    [role="button"].danger.outline:hover {
      background-color: #b91c1c !important;
      border-color: #b91c1c !important;
      color: #ffffff !important;
    }

    /* Form Validation Feedback */
    mark {
      background-color: #fee2e2;
      border: 1px solid #b91c1c;
      color: #991b1b;
      padding: 0.25rem 0.5rem;
    }
    form small {
      color: #b91c1c;
      display: block;
      margin-top: 0.25rem;
    }

    /* Message / Alert Boxes */
    article.alert {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
    }
    article.alert.error,
    article.alert.alert-error,
    article.alert.danger,
    article.alert.alert-danger {
      background-color: #fee2e2;
      border: 1px solid #b91c1c;
      color: #991b1b;
    }
    article.alert.warning,
    article.alert.alert-warning {
      background-color: #fef3c7;
      border: 1px solid #d97706;
      color: #92400e;
    }
    article.alert.success,
    article.alert.alert-success {
      background-color: #d1fae5;
      border: 1px solid #059669;
      color: #065f46;
    }
    article.alert.info,
    article.alert.alert-info {
      background-color: #dbeafe;
      border: 1px solid #2563eb;
      color: #1e40af;
    }
  </style>
</head>
<body>
  {% block root_body %}{% endblock %}
</body>
</html>
