<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Banco Volkskas S.A. - Sistema de Créditos{% endblock %}</title>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Google Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom Volkskas Terminal Style Overrides (Swiss Rationalism / High Precision) -->
    <style>
        :root {
            --vk-primary: #000000;
            --vk-surface: #ffffff;
            --vk-surface-subtle: #f8fafc;
            --vk-surface-container: #eeeeee;
            --vk-surface-container-low: #f4f4f5;
            --vk-border: #000000;
            --vk-border-subtle: #e2e8f0;
            --vk-text-primary: #000000;
            --vk-text-secondary: #52525b;
            --vk-text-muted: #a1a1aa;
        }

        /* Strict Sharp System Override: zero curved borders & flat elevation */
        *, *::before, *::after {
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
            color: var(--vk-text-primary);
            background-color: var(--vk-surface);
            line-height: 1.45;
        }

        /* Monospace / Tabular lining for numbers, dates, codes */
        .font-mono, .tabular-nums, code, pre {
            font-family: 'JetBrains Mono', monospace !important;
            font-variant-numeric: tabular-nums;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            font-size: 18px;
            line-height: 1;
            vertical-align: middle;
        }

        /* High-density Buttons */
        .btn-vk-primary {
            background-color: var(--vk-primary);
            color: #ffffff;
            border: 1px solid var(--vk-primary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 6px 14px;
        }
        .btn-vk-primary:hover, .btn-vk-primary:focus {
            background-color: #27272a;
            color: #ffffff;
            border-color: #27272a;
        }

        .btn-vk-outline {
            background-color: #ffffff;
            color: var(--vk-primary);
            border: 1px solid var(--vk-border);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 6px 12px;
        }
        .btn-vk-outline:hover {
            background-color: var(--vk-surface-container);
            color: var(--vk-primary);
            border-color: var(--vk-border);
        }

        .btn-vk-danger {
            background-color: #ffffff;
            color: #dc2626;
            border: 1px solid #dc2626;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 6px 12px;
        }
        .btn-vk-danger:hover {
            background-color: #dc2626;
            color: #ffffff;
        }

        /* Form Controls */
        .form-control, .form-select {
            border: 1px solid var(--vk-border);
            font-size: 13px;
            color: var(--vk-text-primary);
            background-color: #ffffff;
            padding: 6px 10px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--vk-primary);
            outline: 1px solid var(--vk-primary);
            box-shadow: none;
        }

        /* High Density Table */
        .table-vk {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table-vk th {
            background-color: var(--vk-surface-container-low);
            border-bottom: 2px solid var(--vk-border);
            color: var(--vk-text-primary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 8px 12px;
        }
        .table-vk td {
            border-bottom: 1px solid var(--vk-border-subtle);
            padding: 8px 12px;
            vertical-align: middle;
        }
        .table-vk tr:hover td {
            background-color: var(--vk-surface-subtle);
        }

        /* Sidebar Item States */
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            color: var(--vk-text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: none;
        }
        .sidebar-link:hover {
            color: var(--vk-primary);
            background-color: var(--vk-surface-container);
        }
        .sidebar-link.active {
            color: var(--vk-primary);
            background-color: var(--vk-surface-container-low);
            border-left: 3px solid var(--vk-primary);
            font-weight: 700;
        }
        .sidebar-link.disabled-route {
            color: var(--vk-text-muted);
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
            background-color: transparent;
        }

        /* Badges */
        .badge-vk {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 2px 6px;
            border: 1px solid var(--vk-border);
            text-transform: uppercase;
        }
        .badge-vk-active {
            background-color: var(--vk-primary);
            color: #ffffff;
            border-color: var(--vk-primary);
        }
        .badge-vk-neutral {
            background-color: #ffffff;
            color: var(--vk-primary);
        }
        .badge-vk-danger {
            background-color: #fef2f2;
            color: #dc2626;
            border-color: #dc2626;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}h-100{% endblock %}">
    {% block root_body %}
    {% endblock %}

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
