{% extends "base_dashboard.html" %}

{% block page_title %}Bitácora de Auditoría{% endblock %}

{% block actions %}
<a href="{% url 'usuarios:usuario_list' %}" role="button" class="outline">Usuarios</a>
{% endblock %}

{% block content %}
<form method="get">
  <div class="grid">
    <input type="search" name="q" value="{{ q }}" placeholder="Buscar operación o usuario...">
    <select name="entidad">
      <option value="">Todas las entidades</option>
      {% for ent in entidades %}
      <option value="{{ ent }}" {% if selected_entidad == ent %}selected{% endif %}>{{ ent }}</option>
      {% endfor %}
    </select>
    <button type="submit">Filtrar</button>
  </div>
</form>

<figure>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Operación</th>
        <th>Entidad</th>
        <th>Resultado</th>
      </tr>
    </thead>
    <tbody>
      {% for a in auditorias %}
      <tr>
        <td>#{{ a.id }}</td>
        <td>{% if a.usuario %}{{ a.usuario.login }}{% else %}SISTEMA{% endif %}</td>
        <td>{{ a.operacion }}</td>
        <td>{{ a.entidad }} #{{ a.id_entidad }}</td>
        <td>{{ a.resultado }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="5">Sin registros de auditoría.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% endblock %}
