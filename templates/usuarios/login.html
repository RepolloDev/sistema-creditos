{% extends "base_root.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block root_body %}
<main class="container" style="max-width: 420px; padding-top: 12vh;">
  <article>
    <header>
      <strong>BANCO VOLKSKAS</strong><br>
      <small>Sistema de Créditos</small>
    </header>

    {% if form.non_field_errors %}
      <p><mark>{{ form.non_field_errors|striptags }}</mark></p>
    {% endif %}

    <form method="post" action="{% url 'usuarios:login' %}">
      {% csrf_token %}
      <label>
        Usuario
        {{ form.username }}
      </label>
      <label>
        Contraseña
        {{ form.password }}
      </label>
      <button type="submit">Ingresar</button>
    </form>
  </article>
</main>
{% endblock %}
