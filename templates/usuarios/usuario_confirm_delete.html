{% extends "base_dashboard.html" %}

{% block page_title %}Eliminar Usuario{% endblock %}

{% block content %}
<article>
  <p>¿Confirmar eliminación del usuario <strong>{{ object.login }}</strong> ({{ object.nombre_completo }})?</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <a href="{% url 'usuarios:usuario_list' %}" role="button" class="outline">Cancelar</a>
      <button type="submit" class="danger">Eliminar</button>
    </div>
  </form>
</article>
{% endblock %}
