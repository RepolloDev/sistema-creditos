{% extends "base_dashboard.html" %}

{% block page_title %}Usuarios{% endblock %}

{% block actions %}
<a href="{% url 'usuarios:usuario_create' %}" role="button">+ Nuevo Usuario</a>
{% endblock %}

{% block content %}
<form method="get">
  <div class="grid">
    <input type="search" name="q" value="{{ q }}" placeholder="Buscar usuario o nombre...">
    <select name="rol">
      <option value="">Todos los roles</option>
      {% for code, label in roles %}
      <option value="{{ code }}" {% if selected_rol == code %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <button type="submit">Filtrar</button>
  </div>
</form>

<figure>
  <table>
    <thead>
      <tr>
        <th>Usuario</th>
        <th>Nombre Completo</th>
        <th>Rol</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for u in usuarios %}
      <tr>
        <td><strong>{{ u.login }}</strong></td>
        <td>{{ u.nombre_completo }}</td>
        <td>{{ u.get_rol_display }}</td>
        <td>{% if u.activo %}<span class="badge badge-activo">Activo</span>{% else %}<span class="badge badge-inactivo">Inactivo</span>{% endif %}</td>
        <td>
          <div class="actions">
            <a href="{% url 'usuarios:usuario_update' u.pk %}" role="button" class="outline">Editar</a>
            {% if u != request.user %}
            <a href="{% url 'usuarios:usuario_delete' u.pk %}" role="button" class="outline danger">Eliminar</a>
            {% endif %}
          </div>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5">Sin usuarios registrados.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</figure>

{% include "includes/paginacion.html" %}
{% endblock %}
