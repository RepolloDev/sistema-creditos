[project]
name = "sis-creditos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "django>=5.2.18",
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pyside6>=6.12.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "ruff>=0.17.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "python manage.py runserver"
migrate = "python manage.py migrate"
makemigrations = "python manage.py makemigrations"
check = "python manage.py check"
test = "python manage.py test"
seed = "python database/seed.py"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "**/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = ["E501", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"database/seed.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false


